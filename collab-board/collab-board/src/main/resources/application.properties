spring.application.name=collab-board
# Database connection
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:6060}/collab_board${DB_SSL_PARAM:}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:harsh@1061}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server port
server.port=8080

logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG

jwt.secret=${JWT_SECRET:your-own-long-random-string-at-least-32-characters-here-change-this}