version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: collab-board-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: collab_board
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "6060:5432"
    volumes:
      - collab_board_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./collab-board/collab-board
      dockerfile: Dockerfile
    container_name: collab-board-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./collab-board-frontend
      dockerfile: Dockerfile
    container_name: collab-board-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8082:80"

volumes:
  collab_board_pg_data:
