name: Build and Deploy to Azure

on:
  push:
    branches: [ main ]

env:
  ACR_NAME: collabboardacr
  ACR_LOGIN_SERVER: collabboardacr-axaae5gqgdc3ahgn.azurecr.io
  BACKEND_URL: https://collab-board-backend.wittyhill-2d8ef2d7.centralindia.azurecontainerapps.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/collab-board-backend:${{ github.sha }} ./collab-board/collab-board
          docker push ${{ env.ACR_LOGIN_SERVER }}/collab-board-backend:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ env.BACKEND_URL }}/api \
            --build-arg VITE_WS_BASE_URL=${{ env.BACKEND_URL }}/ws \
            -t ${{ env.ACR_LOGIN_SERVER }}/collab-board-frontend:${{ github.sha }} \
            ./collab-board-frontend
                  docker push ${{ env.ACR_LOGIN_SERVER }}/collab-board-frontend:${{ github.sha }}

      - name: Debug - check baked-in URL
        run: |
          docker run --rm --entrypoint sh ${{ env.ACR_LOGIN_SERVER }}/collab-board-frontend:${{ github.sha }} -c "grep -o 'baseURL:[^,]*' /usr/share/nginx/html/assets/*.js"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy new backend revision
        run: |
          az containerapp update \
            --name collab-board-backend \
            --resource-group collab-board-rg \
            --image ${{ env.ACR_LOGIN_SERVER }}/collab-board-backend:${{ github.sha }}

      - name: Deploy new frontend revision
        run: |
          az containerapp update \
            --name collab-board-frontend \
            --resource-group collab-board-rg \
            --image ${{ env.ACR_LOGIN_SERVER }}/collab-board-frontend:${{ github.sha }}